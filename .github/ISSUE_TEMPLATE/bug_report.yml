name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please remove anything private (names, IP addresses, Steam IDs) from logs and screenshots.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the mod's About / credits window, e.g. v0.3.0 "Lockstep"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      placeholder: 0.2.16a5
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Other mods, number of players and who hosted (for Multiplayer), how the Agent was driven (for the Agent mod)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant part of BepInEx/LogOutput.log from the game folder
      render: text
